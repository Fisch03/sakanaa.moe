[workspace]
resolver = "2"
members = [
    "server",
    "site",
    "common", "macros", "wasm_bridge",
]

[workspace.dependencies]
maud = { version = "0.27" }

image = { version = "0.25", default-features = false, features = ["png"] }

rand = { version = "0.9" , default-features = false, features = ["std", "thread_rng"]}

serde = { version = "1", features = ["derive"] }

base64 = "0.22"

thiserror = "2"
anyhow = "1"

log = "0.4"

web-sys = "0.3"
wasm-bindgen = "0.2"
js-sys = "0.3"

